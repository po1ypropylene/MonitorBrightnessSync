workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - build
  - release

variables:
  XCODE_PROJECT: MonitorBrightnessSync.xcodeproj
  XCODE_SCHEME: MonitorPlus
  PRODUCT_NAME: MonitorBrightnessSync
  RELEASE_TAG: "v0.${CI_PIPELINE_IID}"
  ARCHIVE_NAME: "MonitorBrightnessSync-${CI_COMMIT_SHORT_SHA}-macOS.zip"

.macos_saas_runner:
  tags:
    - saas-macos-medium-m1
  image: macos-26-xcode-26

build_binary:
  extends: .macos_saas_runner
  stage: build
  script:
    - set -euo pipefail
    - xcodebuild
      -project "$XCODE_PROJECT"
      -scheme "$XCODE_SCHEME"
      -configuration Release
      -destination 'generic/platform=macOS'
      -derivedDataPath build/DerivedData
      CODE_SIGNING_ALLOWED=NO
      build
    - mkdir -p dist
    - ditto -c -k --keepParent "build/DerivedData/Build/Products/Release/${PRODUCT_NAME}" "dist/${ARCHIVE_NAME}"
  artifacts:
    name: "$PRODUCT_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/*.zip
    expire_in: 1 week

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: build_binary
      artifacts: true
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - set -euo pipefail
    - glab release create "$RELEASE_TAG" dist/*.zip
      --name "Release $RELEASE_TAG"
      --notes "Automated release for ${CI_COMMIT_SHA}"
      --ref "$CI_COMMIT_SHA"
      --use-package-registry
